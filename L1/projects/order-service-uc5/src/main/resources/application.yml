server:
  port: 8083

spring:
  application:
    name: order-service

services:
  cart:
    base-url: ${CART_SERVICE_BASE_URL:http://localhost:8082}
  product-catalog:
    base-url: ${PRODUCT_SERVICE_BASE_URL:http://localhost:8081}

payment:
  gateway:
    api-key: ${PAYMENT_GATEWAY_API_KEY}
    base-url: ${PAYMENT_GATEWAY_BASE_URL:https://payments.example.com}

# L1/UC5 addition: explicit HTTP client timeouts (see OrderServiceApplication
# and edge-cases/edge-case-catalog.md, "Payment timeout"). Defaults chosen to
# fail fast well before a typical end-user request timeout.
http-client:
  connect-timeout-ms: 2000
  read-timeout-ms: 3000
