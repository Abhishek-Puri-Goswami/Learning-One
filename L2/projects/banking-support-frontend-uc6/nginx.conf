server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: any unmatched path serves index.html so client-side
    # tab switching (Policy Q&A / My Account) survives a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
