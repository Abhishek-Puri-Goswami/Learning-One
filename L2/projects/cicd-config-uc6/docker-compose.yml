# L2 HLD UseCase6 LLD 7.1 "Local Deployment" -- the containerized
# equivalent of README.md's "clone repo, configure env vars, start backend,
# start frontend" steps. Not build-verified here (no Docker daemon in this
# sandbox, and banking-support-service needs Maven Central) -- see each
# Dockerfile's own header comment for exactly what was and wasn't run.
name: banking-support-system

services:
  backend:
    build:
      context: ../banking-support-service
      dockerfile: Dockerfile
    ports:
      - "8085:8085"
    environment:
      # MUST be overridden with a real secret in any non-local deployment --
      # this default only exists so `docker compose up` works out of the box
      # for local evaluation, matching application.yml's own dev default.
      BANKRAG_JWT_SECRET: demo-only-secret-key-not-for-production-use-32chars-min
      SPRING_PROFILES_ACTIVE: dev
    volumes:
      - ../banking-support-core/corpus:/app/corpus:ro
      - backend-reports:/app/reports
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ../banking-support-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8085
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-reports:
