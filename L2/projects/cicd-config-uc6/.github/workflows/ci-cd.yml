name: Banking RAG System CI/CD

# Deliverable: "Operational CI/CD pipeline (GitHub Actions / Azure DevOps)
# with automated validation + deployment" (L2 HLD UseCase6). LLD 6.1's
# pipeline requirements, mapped to jobs below:
#   "Run tests"                 -> core-tests, rbac-and-security-tests
#   "Validate JWT logic"        -> rbac-and-security-tests
#   "Validate RAG components"   -> core-tests, evaluation
#   "Perform lint checks"       -> lint, frontend-build-and-lint
#   "Build container images"    -> docker-build
#   "Allow deployment only if
#    tests pass"                -> deploy's `needs:` chain (every prior job)
#
# Disclosed limitation: this workflow was authored and its YAML syntax
# validated (python yaml.safe_load) in a sandbox where GitHub's own runners
# are obviously not available, so it was never actually fired here. What
# WAS actually run here, directly (not just described), is every step
# `core-tests`, `rbac-and-security-tests`, and `frontend-build-and-lint`
# perform -- see reports/ for their real output. Those three jobs need no
# external Maven Central access (pure-JDK `javac`/`java`, and npm which IS
# reachable in this sandbox), so this workflow would run identically on a
# real GitHub Actions runner, which additionally has open network access
# for `maven-build-service`'s Maven Central-dependent steps -- the one job
# whose commands were only run in a real Maven-reachable environment
# conceptually, not literally executed in this authoring sandbox.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  JAVA_VERSION: "17"
  NODE_VERSION: "22"

jobs:
  # ---------- "Perform lint checks" (core half) ----------
  lint:
    name: Lint (javac -Xlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: javac -Xlint:all (no warnings treated as build-breaking, but reported)
        working-directory: banking-support-core
        run: |
          mkdir -p out-lint
          javac -Xlint:all -d out-lint $(find src/main/java -name "*.java") $(find src/test/java -name "*.java")

  # ---------- "Run tests" + "Validate RAG components" (pure-JDK core) ----------
  core-tests:
    name: Core build & tests (pure JDK, no Maven Central needed)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Compile banking-support-core
        working-directory: banking-support-core
        run: |
          mkdir -p out
          javac -d out $(find src/main/java -name "*.java") $(find src/test/java -name "*.java")
      - name: Run integration SelfTests (RAG + secure data + observability, composed)
        working-directory: banking-support-core
        run: java -cp out com.retailco.bankrag.integration.SelfTests
      - name: Run full integrated demo (produces trace-log.jsonl + audit-log.jsonl)
        working-directory: banking-support-core
        run: java -cp out com.retailco.bankrag.integration.Main corpus
      - uses: actions/upload-artifact@v4
        with:
          name: core-run-reports
          path: banking-support-core/reports/

  # ---------- "Validate JWT logic" + "Masking security tests" + "Unauthorized access tests" ----------
  rbac-and-security-tests:
    name: RBAC, JWT & PII-masking security tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Compile banking-support-core
        working-directory: banking-support-core
        run: |
          mkdir -p out
          javac -d out $(find src/main/java -name "*.java") $(find src/test/java -name "*.java")
      - name: Run RBAC + audit-logging self-tests
        working-directory: banking-support-core
        run: java -cp out com.retailco.bankrag.rbac.RbacAndAuditSelfTests
      - name: Secret-scan (no hardcoded production secrets committed)
        run: |
          # Deliberately simple pattern scan (a real pipeline would use
          # gitleaks/trufflehog -- not installable here without network
          # access this sandbox doesn't reliably have for third-party
          # GitHub Actions marketplace tools). Fails the build if any
          # non-"demo"/"test" secret-shaped string leaks into source.
          if grep -rniE "(aws_secret|private_key|BEGIN RSA)" --include="*.java" --include="*.yml" --include="*.yaml" . | grep -v -iE "demo|test|example|placeholder"; then
            echo "Potential hardcoded secret found -- failing build."
            exit 1
          fi
          echo "No hardcoded-secret patterns found."

  # ---------- "LangSmith evaluation stage" ----------
  evaluation:
    name: Evaluation stage (trace + threshold sweep)
    runs-on: ubuntu-latest
    needs: [core-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Compile banking-support-core
        working-directory: banking-support-core
        run: |
          mkdir -p out
          javac -d out $(find src/main/java -name "*.java") $(find src/test/java -name "*.java")
      - name: Run evaluation demo and validate trace log is well-formed JSONL
        working-directory: banking-support-core
        run: |
          java -cp out com.retailco.bankrag.integration.Main corpus
          python3 -c "
          import json
          with open('reports/integrated-trace-log.jsonl') as f:
              lines = [l for l in f if l.strip()]
          for l in lines:
              json.loads(l)
          print(f'{len(lines)} trace records, all valid JSON')
          "

  # ---------- "Perform lint checks" (frontend half) + frontend build ----------
  frontend-build-and-lint:
    name: Frontend build & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: banking-support-frontend/package-lock.json
      - working-directory: banking-support-frontend
        run: npm ci
      - working-directory: banking-support-frontend
        run: npm run lint
      - working-directory: banking-support-frontend
        run: npm run build

  # ---------- Spring Boot service: needs real Maven Central access ----------
  maven-build-service:
    name: banking-support-service (Maven build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: mvn clean verify
        working-directory: banking-support-service
        run: mvn -B clean verify

  # ---------- "Build container images" ----------
  docker-build:
    name: Build container images
    runs-on: ubuntu-latest
    needs: [core-tests, rbac-and-security-tests, evaluation, frontend-build-and-lint, maven-build-service]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build banking-support-service image
        uses: docker/build-push-action@v6
        with:
          context: banking-support-service
          push: false
          tags: banking-support-service:${{ github.sha }}
      - name: Build banking-support-frontend image
        uses: docker/build-push-action@v6
        with:
          context: banking-support-frontend
          push: false
          tags: banking-support-frontend:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.PROD_API_BASE_URL || 'http://localhost:8085' }}

  # ---------- "Approve deployment only when tests pass" ----------
  deploy:
    name: Deploy (main branch only)
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Deploy
        run: |
          echo "All prior jobs succeeded (lint, core-tests, rbac-and-security-tests,"
          echo "evaluation, frontend-build-and-lint, maven-build-service, docker-build)."
          echo "This step is illustrative -- pushing to a real registry/cluster needs"
          echo "credentials this submission does not provision. See"
          echo "deployment/deployment-model.md for what a real deploy step here"
          echo "would do (docker push + kubectl apply -f deployment/k8s/, or"
          echo "an Azure DevOps release gate equivalent)."
